<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Farm · ABCDryBASIN</title>
  <meta name="description" content="Interactive 3D model of an integrated, climate-smart farm.">
  <meta name="theme-color" content="#0b2a52">
  <link rel="icon" href="/assets/abcdrybasin.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #10202e; --panel: rgba(255, 255, 255, 0.86); --accent: #0b2a52; --hl: #ffc23d; --line: rgba(16, 32, 46, 0.12); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c9d8; font-family: Poppins, system-ui, sans-serif; color: var(--ink); }
    canvas { display: block; touch-action: none; }
    button { font: inherit; }
    .glass { background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); border-radius: 12px; }
    .ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
          padding: 10px 14px; font-size: 13px; max-width: calc(100vw - 32px); }
    .ui label { display: flex; gap: 8px; align-items: center; }
    .ui input[type=range] { width: 140px; accent-color: var(--accent); }
    .btn { border: 0; border-radius: 8px; padding: 6px 12px; background: var(--accent); color: #fff; cursor: pointer; }
    .btn.alt { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .ui .hint { opacity: 0.7; }
    .back { position: fixed; left: 16px; top: 16px; padding: 8px 12px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 500; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #c6d4e0; transition: opacity 0.6s; z-index: 50; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .box { width: min(320px, 80vw); text-align: center; font-size: 14px; }
    #loader .bar { height: 6px; margin-top: 12px; border-radius: 3px; background: rgba(11, 42, 82, 0.15); overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }


    /* ---------- digital-twin overlay ---------- */
    :root { --hud-bg: rgba(5, 28, 36, 0.72); --hud-line: rgba(88, 226, 210, 0.35); --hud-ink: #dffbf7; --hud-acc: #3ee6cf; --hud-dim: rgba(223, 251, 247, 0.62); }
    .hud-markers { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
    .hud-marker { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0;
                  border: 0; background: none; cursor: pointer; pointer-events: auto; transform-origin: 50% 100%; font: inherit; }
    .hud-marker .pin { width: 38px; height: 38px; display: grid; place-items: center; font-size: 19px; border-radius: 50%;
                       background: radial-gradient(circle at 35% 30%, rgba(62, 230, 207, 0.55), rgba(5, 40, 48, 0.9));
                       border: 2px solid var(--hud-acc); box-shadow: 0 0 14px rgba(62, 230, 207, 0.55); transition: transform 0.2s; }
    .hud-marker .name { padding: 2px 8px; border-radius: 6px; background: var(--hud-bg); color: var(--hud-ink); font-size: 12px;
                        white-space: nowrap; border: 1px solid var(--hud-line); backdrop-filter: blur(4px); }
    .hud-marker .stem { position: absolute; top: 100%; left: 50%; width: 2px; margin-left: -1px;
                        background: linear-gradient(var(--hud-acc), rgba(62, 230, 207, 0)); pointer-events: none; }
    .hud-marker:hover .pin, .hud-marker.on .pin { transform: scale(1.15); box-shadow: 0 0 22px rgba(62, 230, 207, 0.9); }
    .hud-marker.on .name { background: var(--hud-acc); color: #032027; font-weight: 600; }
    .hud-tabs { position: fixed; top: 14px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100vw - 460px);
                display: flex; gap: 4px; padding: 5px; z-index: 6; overflow-x: auto; border-radius: 12px;
                background: var(--hud-bg); border: 1px solid var(--hud-line); backdrop-filter: blur(8px); }
    .hud-tabs .tab { flex: none; border: 0; background: none; color: var(--hud-ink); padding: 6px 11px; border-radius: 8px; cursor: pointer;
                     font: inherit; font-size: 12.5px; white-space: nowrap; }
    .hud-tabs .tab:hover { background: rgba(62, 230, 207, 0.15); }
    .hud-tabs .tab.on { background: var(--hud-acc); color: #032027; font-weight: 600; }
    .hud-tabs .tab.tour { color: var(--hud-acc); border: 1px solid var(--hud-line); }
    .hud-panel { position: fixed; z-index: 5; color: var(--hud-ink); font-size: 12.5px; padding: 14px; border-radius: 14px;
                 background: var(--hud-bg); border: 1px solid var(--hud-line); backdrop-filter: blur(8px);
                 box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), inset 0 0 30px rgba(62, 230, 207, 0.06); }
    .hud-panel h2 { margin: 0; font-size: 16px; letter-spacing: 0.02em; }
    .hud-panel h3 { margin: 14px 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--hud-acc);
                    display: flex; justify-content: space-between; align-items: baseline; }
    .hud-panel h3 small { color: var(--hud-dim); letter-spacing: 0; text-transform: none; }
    .hud-panel .sub { margin: 2px 0 0; color: var(--hud-dim); }
    .hud-left { left: 16px; top: 70px; width: 250px; max-height: calc(100vh - 160px); overflow: auto; }
    .hud-left .gauges { display: flex; justify-content: space-between; margin-top: 12px; }
    .gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 33%; text-align: center; color: var(--hud-dim); font-size: 11px; }
    .gauge .ring { position: relative; width: 58px; height: 58px; }
    .gauge svg { width: 100%; height: 100%; }
    .gauge .track { fill: none; stroke: rgba(62, 230, 207, 0.15); stroke-width: 6; }
    .gauge .val { fill: none; stroke: var(--hud-acc); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(62, 230, 207, 0.7)); }
    .gauge b { position: absolute; inset: 0; display: grid; place-items: center; color: var(--hud-ink); font-size: 13px; }
    .hud-left .zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
    .hud-left .zones button { width: 100%; display: flex; justify-content: space-between; gap: 6px; border: 0; padding: 6px 8px; border-radius: 7px;
                              background: rgba(62, 230, 207, 0.06); color: var(--hud-ink); cursor: pointer; font: inherit; text-align: left; }
    .hud-left .zones button:hover { background: rgba(62, 230, 207, 0.16); }
    .hud-left .zones li.on button { background: rgba(62, 230, 207, 0.28); }
    .hud-left .zones em { color: var(--hud-dim); font-style: normal; white-space: nowrap; }
    .hud-left .zone-card { margin-top: 10px; padding: 10px; border-radius: 9px; border: 1px solid var(--hud-line); background: rgba(62, 230, 207, 0.08); }
    .hud-left .zone-card p { margin: 4px 0 0; color: var(--hud-dim); line-height: 1.45; }
    .hud-right { right: 16px; top: 70px; width: 250px; max-height: calc(100vh - 290px); overflow: auto; }
    .hud-right .clock { color: var(--hud-dim); font-size: 11.5px; }
    .hud-right .temp { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 8px; }
    .hud-right .temp b { font-size: 30px; font-weight: 600; }
    .hud-right .temp span { color: var(--hud-acc); }
    .hud-right .wx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .hud-right .wx span { display: flex; flex-direction: column; padding: 6px; border-radius: 7px; background: rgba(62, 230, 207, 0.07); font-weight: 600; }
    .hud-right .wx small { color: var(--hud-dim); font-weight: 400; font-size: 10.5px; }
    .hud-right .kpis { display: grid; gap: 9px; }
    .hud-right .kpi .row { display: flex; justify-content: space-between; gap: 8px; }
    .hud-right .kpi .row span { color: var(--hud-dim); }
    .hud-right .kpi small { color: var(--hud-dim); font-weight: 400; }
    .hud-right .kpi .bar { height: 4px; margin-top: 4px; border-radius: 2px; background: rgba(62, 230, 207, 0.14); overflow: hidden; }
    .hud-right .kpi .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2bb7a6, var(--hud-acc)); box-shadow: 0 0 6px var(--hud-acc); }
    .hud-sensors { right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); }
    .hud-sensors h3 { margin-top: 0; }
    .hud-sensors .bars { display: flex; gap: 8px; align-items: flex-end; height: 120px; }
    .hud-sensors .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; min-width: 0; }
    .hud-sensors .col b { font-size: 11px; }
    .hud-sensors .col .track { flex: 1; width: 16px; display: flex; align-items: flex-end; border-radius: 4px; background: rgba(62, 230, 207, 0.1); }
    .hud-sensors .col .track i { display: block; width: 100%; border-radius: 4px; background: linear-gradient(0deg, #1f8f84, var(--hud-acc));
                                 box-shadow: 0 0 8px rgba(62, 230, 207, 0.6); }
    .hud-sensors .col span { color: var(--hud-dim); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    body.hud-off .hud-panel, body.hud-off .hud-tabs { display: none; }
    body:not(.hud-off) .ui .hint { display: none; }
    body.editing .hud-panel, body.editing .hud-tabs { display: none; }
    @media (max-width: 900px) { .hud-left, .hud-right { width: 200px; } .hud-sensors { display: none; }
                                .hud-tabs { top: auto; bottom: 76px; max-width: calc(100vw - 32px); } }
    @media (max-width: 640px) { .hud-panel { display: none; } }

    /* ---------- walking characters ---------- */
    .walk-help { position: fixed; top: 64px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100vw - 32px); display: none;
                 padding: 7px 14px; border-radius: 10px; background: rgba(5, 28, 36, 0.78); color: #dffbf7; font-size: 13px; z-index: 7; }
    body.walking .walk-help { display: block; }
    body.walking .ui .hint { display: none; }
    body.walking .hud-tabs, body.walking .hud-markers { display: none; }
    .joystick { position: fixed; right: 28px; bottom: 110px; width: 120px; height: 120px; border-radius: 50%; display: none; z-index: 8;
                background: rgba(5, 28, 36, 0.45); border: 2px solid rgba(88, 226, 210, 0.6); touch-action: none; }
    .joystick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
                  background: rgba(62, 230, 207, 0.85); box-shadow: 0 0 12px rgba(62, 230, 207, 0.8); }
    @media (pointer: coarse) { body.walking .joystick { display: block; } body.walking .walk-help { display: none; } }
    .credits { position: fixed; right: 16px; bottom: 4px; z-index: 3; font-size: 10.5px; color: rgba(255, 255, 255, 0.85);
               text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
    .credits a { color: inherit; }

    /* ---------- editor ---------- */
    .editor-toolbar, .editor-panel, .editor-status { display: none; }
    body.editing .editor-toolbar { display: flex; }
    body.editing .editor-panel { display: block; }
    body.editing .back { display: none; }
    body.editing .ui .hint { display: none; }
    .editor-toolbar { position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; width: fit-content; gap: 10px; padding: 6px; z-index: 10;
                      background: var(--panel); backdrop-filter: blur(8px); border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
                      flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); font-size: 13px; }
    .editor-toolbar .group { display: flex; gap: 4px; align-items: center; padding-right: 10px; border-right: 1px solid var(--line); }
    .editor-toolbar .group:last-of-type { border-right: 0; padding-right: 0; }
    .tb { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); white-space: nowrap; }
    .tb:hover { background: rgba(11, 42, 82, 0.08); }
    .tb.on { background: var(--accent); color: #fff; }
    .tb:disabled { opacity: 0.35; cursor: default; }
    .tb.primary { background: var(--accent); color: #fff; }
    .tb.primary.pending::after { content: ' •'; color: var(--hl); }
    .tb-check { display: flex; gap: 4px; align-items: center; padding: 0 6px; cursor: pointer; }
    .tb-menu { position: relative; }
    .tb-menu summary { list-style: none; }
    .tb-menu summary::-webkit-details-marker { display: none; }
    .tb-menu .menu { position: absolute; right: 0; top: calc(100% + 6px); display: flex; flex-direction: column; min-width: 220px; padding: 6px;
                     background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
    .tb-menu .menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    .tb-menu .menu button:hover { background: rgba(11, 42, 82, 0.08); }
    .editor-panel { position: fixed; top: 72px; bottom: 80px; width: 250px; overflow: auto; padding: 12px; font-size: 13px; z-index: 9;
                    background: var(--panel); backdrop-filter: blur(8px); border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); }
    .editor-panel.palette { left: 12px; }
    .editor-panel.props { right: 12px; bottom: auto; max-height: calc(100vh - 160px); }
    .editor-panel h3 { margin: 0 0 8px; font-size: 14px; }
    .editor-panel h4 { margin: 12px 0 6px; font-size: 13px; }
    .editor-panel .help { opacity: 0.7; line-height: 1.45; margin: 8px 0 0; }
    .palette .search { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); font: inherit; margin-bottom: 8px; }
    .palette .cat summary { cursor: pointer; font-weight: 600; padding: 6px 2px; }
    .palette .items { display: grid; gap: 4px; padding-bottom: 6px; }
    .palette .item { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 8px; text-align: left; cursor: pointer; }
    .palette .item:hover { border-color: var(--accent); }
    .props .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .props .field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
    .props .field input[type=number] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .props .field.slider { margin-top: 10px; }
    .props .field.slider input { width: 100%; accent-color: var(--accent); }
    .props .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .props .actions button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .props .actions button:hover { border-color: var(--accent); }
    .props .actions .danger { color: #b3261e; }
    .props .array .field { margin-top: 6px; }
    .props .swatches { display: grid; gap: 4px; }
    .props .swatch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; }
    .props .swatch.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .props .swatch i { width: 18px; height: 18px; border-radius: 4px; }
    .palette .upload-btn { width: 100%; margin-bottom: 8px; border: 1px dashed var(--accent); background: rgba(11, 42, 82, 0.05);
                           color: var(--accent); border-radius: 8px; padding: 7px 8px; cursor: pointer; font-weight: 500; }
    .palette .item.custom { border-color: rgba(11, 42, 82, 0.35); background: #f3f7ff; }
    .models-dialog { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 40px); border: 0; border-radius: 14px; padding: 20px;
                     box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); font-size: 13px; color: var(--ink); }
    .models-dialog::backdrop { background: rgba(10, 20, 30, 0.35); }
    .models-dialog h3 { margin: 0 0 8px; font-size: 15px; }
    .models-dialog h3 + .help { margin-top: 0; }
    .models-dialog .help { opacity: 0.75; line-height: 1.45; }
    .models-dialog .field { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
    .models-dialog .field.check { flex-direction: row; align-items: center; margin-top: 26px; }
    .models-dialog input[type=text], .models-dialog input[type=number], .models-dialog select {
      padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font: inherit; }
    .models-dialog .row { display: flex; gap: 12px; align-items: flex-start; }
    .models-dialog form { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
    .model-row { display: grid; grid-template-columns: 1fr 70px auto auto; gap: 6px; align-items: center; padding: 6px 0; }
    .model-row small { opacity: 0.6; }
    .model-row input { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .model-row button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 9px; cursor: pointer; }
    .model-row .danger { color: #b3261e; }
    .props .zone-list { display: grid; gap: 3px; margin: 6px 0; max-height: 230px; overflow: auto; }
    .props .zone-row { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 6px 8px; cursor: pointer; font: inherit; }
    .props .zone-row.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .props .field input[type=text], .props .field select, .props .field textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
                                                                                  border-radius: 6px; font: inherit; resize: vertical; }
    .props .field { margin-top: 8px; }
    .dash-dialog { width: min(640px, calc(100vw - 32px)); }
    .dash-dialog h4 { margin: 14px 0 4px; }
    .dash-dialog .row .field { flex: 1; min-width: 0; }
    .dash-dialog input { width: 100%; min-width: 0; }
    .dash-rows { display: grid; gap: 4px; }
    .dash-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-template-columns: 2fr; gap: 6px; align-items: center; }
    .dash-row > button { width: 28px; }
    .dash-row.head span { font-size: 11px; opacity: 0.6; }
    .dash-row input { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .dash-row .danger, .dash-rows .add { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    .dash-row .danger { color: #b3261e; }
    .dash-rows .add { justify-self: start; }
    .editor-status { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; z-index: 11;
                     background: var(--accent); color: #fff; font-size: 13px; max-width: calc(100vw - 32px); }
    .editor-status.show { display: block; }
    .editor-status.error { background: #b3261e; }
    .editor-status.ok { background: #1f6f3f; }
    @media (max-width: 900px) { .editor-panel { width: 200px; } }
    @media (max-width: 600px) { .ui .hint { display: none; } .editor-panel.palette { display: none !important; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader"><div class="box"><div id="loaderText">Loading the farm…</div><div class="bar"><i id="loaderBar"></i></div></div></div>
  <a class="back glass" href="/">← Back to the seminar</a>
  <div class="ui glass">
    <label>Time of day <input id="sun" type="range" min="4" max="60" step="0.5" value="30"></label>
    <button id="spin" class="btn" type="button">Auto-rotate</button>
    <button id="hudToggle" class="btn alt" type="button">Hide dashboard</button>
    <button id="walk" class="btn alt" type="button" hidden>🚶 Walk as farmer</button>
    <button id="edit" class="btn alt" type="button" hidden>Edit farm</button>
    <span class="hint">Drag to orbit · scroll / pinch to zoom · right-drag to pan</span>
  </div>
  <div id="walkHelp" class="walk-help">W A S D / arrow keys to walk · Shift to run · drag to look around · Esc to stop</div>
  <div id="joystick" class="joystick"><i></i></div>
  <div id="credits" class="credits" hidden></div>
  <script type="module" src="/js/farm/main.js"></script>
</body>
</html>
